services:
  codeforge:
    build:
      context: .
      target: runtime
    image: codeforge:latest
    container_name: codeforge
    restart: unless-stopped
    ports:
      # bind to localhost only - a reverse proxy (nginx) terminates TLS for qr.<host> and barcode.<host>
      # override the host port with CODEFORGE_BIND_PORT in .env
      - "127.0.0.1:${CODEFORGE_BIND_PORT:-33002}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CODEFORGE_WORKERS: "2"
      CODEFORGE_RATE_LIMIT: "120/minute"
      CODEFORGE_TRUST_PROXY: "true"
    mem_limit: 1g
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
