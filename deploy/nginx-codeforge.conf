# nginx: serve both legacy hostnames from one codeforge container (127.0.0.1:33002).
# Adjust server_name and the certificate paths, then: nginx -t && systemctl reload nginx

upstream codeforge {
    server 127.0.0.1:33002;
    keepalive 16;
}

server {
    listen 80;
    server_name qr.example.com barcode.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qr.example.com barcode.example.com;

    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;

    access_log /var/log/nginx/codeforge.access.log;
    error_log  /var/log/nginx/codeforge.error.log;

    client_max_body_size 12m;   # decoder uploads (CODEFORGE_MAX_UPLOAD_BYTES)

    location / {
        proxy_pass http://codeforge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
