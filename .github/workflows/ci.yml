name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run the test suite inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: codeforge:ci
          load: true
          cache-from: type=gha
      - name: Smoke test the running container
        run: |
          docker run -d --name cf -p 8000:8000 codeforge:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS "http://localhost:8000/api/v1/qr?data=ci" -o qr.png && file qr.png | grep -q PNG
          curl -fsS "http://localhost:8000/?bcid=code128&text=ci&includetext" -o bc.png && file bc.png | grep -q PNG
          curl -fsS "http://localhost:8000/api/v1/symbologies" | grep -q '"auspost"'
          docker logs cf | tail -5
