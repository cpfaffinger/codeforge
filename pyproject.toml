[project]
name = "codeforge"
version = "1.2.0"
description = "QR code and barcode service: 100+ symbologies, decoder, batch/PDF, OpenAPI, legacy-compatible endpoints"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "cpfaffinger" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-multipart>=0.0.9",
  "segno>=1.6,<2",
  "treepoem>=3.20,<4",
  "Pillow>=10.3,<13",
  "pyzbar>=0.1.9,<0.2",
  "pylibdmtx>=0.1.10,<0.2",
  "setuptools>=70",
  "reportlab>=4.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/cpfaffinger/codeforge"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
