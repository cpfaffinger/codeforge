<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeforge showcase</title>
<meta name="description" content="Every QR code and barcode symbology codeforge can generate, with a rendered example each.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
  .show-head { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .show-head input { font: inherit; padding: .5rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); min-width: 260px; }
  .cat { margin: 1.2rem 0 .5rem; font-size: 1.05rem; display: flex; align-items: baseline; gap: .6rem; }
  .cat:first-of-type { margin-top: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .9rem; }
  .card { display: flex; flex-direction: column; gap: .4rem; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: .8rem; color: var(--text); text-decoration: none; transition: border-color .15s, transform .15s; position: relative; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); text-decoration: none; }
  .card .img { height: 120px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 6px; overflow: hidden; color: #999; font-size: .8rem; }
  .card img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .card .img.failed { color: var(--err); font-size: .78rem; padding: .5rem; text-align: center; background: var(--bg); align-items: flex-start; overflow: auto; line-height: 1.3; }
  .card .title { font-weight: 600; }
  .card .id { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--muted); }
  .card .ex { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ex code { font-size: .78rem; }
  .card.qr { border-color: var(--accent); }
  .card .req { position: absolute; top: .5rem; right: .5rem; font-size: .68rem; background: var(--err); color: #fff; padding: .05rem .35rem; border-radius: 4px; text-transform: uppercase; }
  .count { color: var(--muted); font-size: .9rem; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
  .cat-chips button { font-size: .8rem; padding: .25rem .6rem; }
  .cat-chips button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/favicon.svg" alt="" width="28" height="28"> codeforge</a>
  <nav>
    <a href="/">Playground</a>
    <a href="/showcase"><strong>Showcase</strong></a>
    <a href="/scan">Scan</a>
    <a href="/docs">API docs</a>
    <a href="https://github.com/cpfaffinger/codeforge" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <div class="show-head">
    <div>
      <h1 style="margin:0;font-size:1.4rem">Everything codeforge can generate</h1>
      <div class="count" id="count">loading symbologies ...</div>
    </div>
    <input id="filter" type="search" placeholder="filter: ean, gs1, postal, datamatrix ..." autocomplete="off">
  </div>
  <div class="cat-chips" id="chips"></div>
  <div id="groups"></div>
</main>

<footer class="muted small">Click a card to open it in the playground with the example prefilled. Examples come from BWIPP / bwip-js; symbologies marked <span style="background:var(--err);color:#fff;padding:0 .3rem;border-radius:3px;font-size:.7rem">options</span> need encoder options (shown in the playground).</footer>

<script>
(function () {
  "use strict";
  const groupsBox = document.getElementById("groups");
  const filter = document.getElementById("filter");
  const count = document.getElementById("count");
  const chips = document.getElementById("chips");
  let items = [], activeCat = "";

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function qs(obj) { const p = new URLSearchParams(); Object.entries(obj).forEach(([k, v]) => { if (v !== "" && v != null) p.set(k, v); }); return p.toString(); }
  function optionParams(str) {
    const out = {};
    (str || "").split(/\s+/).filter(Boolean).forEach((tok) => { const i = tok.indexOf("="); if (i > 0) out[tok.slice(0, i)] = tok.slice(i + 1); else out[tok] = "true"; });
    return out;
  }

  // images are fetched (not <img src>) so a failing example can show the encoder's error message
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      const box = en.target; observer.unobserve(box);
      fetch(box.dataset.src).then(async (r) => {
        if (!r.ok) {
          let msg = r.status + " " + r.statusText;
          try { const j = await r.json(); msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) { /* keep status */ }
          box.className = "img failed"; box.textContent = msg.replace(/^BWIPP ERROR: bwipp\.\w+ /, "") + " - open the playground to adjust";
          return;
        }
        const img = document.createElement("img"); img.alt = box.dataset.alt; img.src = URL.createObjectURL(await r.blob()); box.textContent = ""; box.appendChild(img);
      }).catch((e) => { box.className = "img failed"; box.textContent = e.message; });
    });
  }, { rootMargin: "300px" });

  function card(item) {
    const a = document.createElement("a");
    a.className = "card" + (item.qr ? " qr" : "");
    a.href = item.href;
    a.dataset.search = (item.id + " " + item.description + " " + item.category).toLowerCase();
    a.dataset.cat = item.category;
    a.innerHTML = '<div class="img" data-src="' + esc(item.img) + '" data-alt="' + esc(item.description) + '">loading ...</div>' +
      (item.required && item.required.length ? '<span class="req" title="needs: ' + esc(item.required.join(", ")) + '">options</span>' : "") +
      '<div class="title">' + esc(item.description) + '</div>' +
      '<div class="id">' + esc(item.id) + '</div>' +
      '<div class="ex" title="' + esc(item.example) + (item.example_options ? "  [" + esc(item.example_options) + "]" : "") + '"><code>' + esc((item.example || "").replace(/\n/g, " ")) + '</code>' + (item.example_options ? ' <span class="muted">' + esc(item.example_options) + "</span>" : "") + '</div>';
    observer.observe(a.querySelector(".img"));
    return a;
  }

  function applyFilter() {
    const q = filter.value.trim().toLowerCase();
    let shown = 0;
    groupsBox.querySelectorAll(".card").forEach((c) => { const on = (!q || c.dataset.search.includes(q)) && (!activeCat || c.dataset.cat === activeCat); c.hidden = !on; if (on) shown++; });
    groupsBox.querySelectorAll(".cat").forEach((h) => { const n = Array.from(h.nextElementSibling.querySelectorAll(".card")).filter((c) => !c.hidden).length; h.hidden = !n; h.nextElementSibling.hidden = !n; h.querySelector(".count").textContent = n; });
    count.textContent = shown + " of " + items.length + " symbologies";
  }

  async function init() {
    const list = await (await fetch("/api/v1/symbologies")).json();
    items = [{
      qr: true, id: "qr (segno)", description: "QR Code - native renderer (PNG, SVG, PDF, colours, Micro QR)", example: "https://github.com/cpfaffinger/codeforge", category: "2D matrix codes",
      img: "/api/v1/qr?" + qs({ data: "https://github.com/cpfaffinger/codeforge", scale: 4, border: 2 }),
      href: "/?" + qs({ tab: "qr", data: "https://github.com/cpfaffinger/codeforge" }),
    }].concat(list.map((s) => {
      const opts = optionParams(s.example_options);
      return {
        id: s.id, description: s.description, example: s.example, example_options: s.example_options, category: s.category || "Other", required: s.required_options,
        img: "/api/v1/barcode?" + qs(Object.assign({ bcid: s.id, text: s.example || s.id, scale: 2 }, opts)),
        href: "/?" + qs({ tab: "barcode", bcid: s.id, text: s.example || "", options: s.example_options || "" }),
      };
    }));
    const byCat = {};
    items.forEach((it) => { (byCat[it.category] = byCat[it.category] || []).push(it); });
    Object.keys(byCat).sort().forEach((cat) => {
      const h = document.createElement("h2"); h.className = "cat"; h.innerHTML = esc(cat) + ' <span class="count"></span>';
      const grid = document.createElement("div"); grid.className = "cards";
      byCat[cat].forEach((it) => grid.appendChild(card(it)));
      groupsBox.appendChild(h); groupsBox.appendChild(grid);
      const chip = document.createElement("button"); chip.type = "button"; chip.textContent = cat; chip.addEventListener("click", () => { activeCat = activeCat === cat ? "" : cat; chips.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.textContent === activeCat)); applyFilter(); });
      chips.appendChild(chip);
    });
    applyFilter();
    filter.addEventListener("input", applyFilter);
    const q = new URLSearchParams(location.search).get("q");
    if (q) { filter.value = q; applyFilter(); }
  }
  init().catch((e) => { count.textContent = "could not load symbologies: " + e.message; });
})();
</script>
</body>
</html>
